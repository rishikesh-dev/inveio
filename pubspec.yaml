name: inveio
description: "Inveio — AI-powered expense management app built with Flutter."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.14+1
  go_router: ^17.2.3
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  fpdart: ^1.2.0
  google_sign_in: ^7.2.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.5
  path_provider: ^2.1.6
  equatable: ^2.0.8
  url_launcher: ^6.3.2
  intl: ^0.19.0
  google_mlkit_text_recognition: ^0.17.1
  google_mlkit_document_scanner: ^0.6.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  mocktail: ^1.0.5
  isar_community_generator: ^3.3.2
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/illustrations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_28pt-Regular.ttf
        - asset: assets/fonts/Inter/Inter_28pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_28pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_28pt-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBM-Plex-Mono/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBM-Plex-Mono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBM-Plex-Mono/IBMPlexMono-Bold.ttf
          weight: 700
